[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compareexpressions-criteria"
version = "0.1.0"
description = "Criteria DSL parser and evaluation graph extracted from compareExpressions."
requires-python = ">=3.8"
dependencies = [
    "compareexpressions-slr-parsing",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["criteria*"]
