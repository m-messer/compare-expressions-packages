[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compareexpressions-slr-parsing"
version = "0.1.0"
description = "Generic SLR(1) parser engine extracted from compareExpressions."
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["slr_parsing*"]
