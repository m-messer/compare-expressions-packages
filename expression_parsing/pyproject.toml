[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compareexpressions-expression-parsing"
version = "0.1.0"
description = "SymPy-based expression parsing, preprocessing and LaTeX preview extracted from compareExpressions."
requires-python = ">=3.8"
dependencies = [
    "compareexpressions-slr-parsing",
    "sympy",
    "latex2sympy2",
    "typing_extensions",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["expression_parsing*"]
